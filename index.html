<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Funky Dancer</title>
    <link rel="stylesheet" type="text/css" href="./assets/stylesheets/reset.css" />
    <link rel="stylesheet" type="text/css" href="./assets/stylesheets/frizzy_dance.css" />
    <link href="https://fonts.googleapis.com/css?family=Indie+Flower" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Exo:400,900" rel="stylesheet">
    <link rel="shortcut icon" href="./assets/images/favicon.ico"/>
    <script src="https://use.fontawesome.com/ddf7cec12a.js"></script>
    <script src="https://code.createjs.com/createjs-2015.11.26.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript" src="bundle.js"></script>

    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

      ga('create', 'UA-102705047-3', 'auto');
      ga('send', 'pageview');
    </script>
  </head>
  <body>
    <!-- <i class="fa fa-info-circle" aria-hidden="true"></i> -->
    <div class="title-bar">
      <a href="https://brenopaiva.com"><img src="./assets/images/bee.jpg" alt="Breno Paiva" class="breno-profile"></a>
      <h1>Funky Dancer</h1>
      <a href="https://github.com/Breno-Paiva"><i class="fa fa-github fa-2x" aria-hidden="true"></i></a>
    </div>

    <a class="modern-cta" href="./modern/dist/index.html">
      <i class="fa fa-bolt" aria-hidden="true"></i>
      Try the Modern Edition
      <span class="version-badge version-badge--new">new</span>
    </a>

    <div id="classic-version">
      <p class="version-caption">Classic Edition &mdash; circa 2017</p>
      <canvas id="gameCanvas" width="650" height="400">
      </canvas>
      <div class="streak-container">
        <div class="streak-bar">

        </div>

      </div>
      <div class="interface">
        <div class="directions">
          <h2 id="groove">  HOW TO GROOVE  </h2>
          <h2><i class="fa fa-volume-up" aria-hidden="true"></i>CRANK UP THE VOLUME<i class="fa fa-volume-up" aria-hidden="true"></i></h2>
          <h2><i class="fa fa-play-circle" aria-hidden="true"></i>Pick a song  |  Press play<i class="fa fa-play-circle" aria-hidden="true"></i></h2>
          <h2><i class="fa fa-thumbs-up" aria-hidden="true"></i>Dance using the designated keys<i class="fa fa-thumbs-up" aria-hidden="true"></i></h2>
        </div>
        <div class="gameplay">
          <button type="button" id="play" name="button">PLAY</button>
          <h3>Pick a song below:</h3>
          <div>
            <button type="button" id="song1" name="button">Catz</button>
            <button type="button" id="song2" name="button">Dat Funk</button>
          </div>
          <div id="score-div">
            <h2>Score:</h2>
            <h2 id="score">0</h2>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
