<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Funky Dancer — Modern</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #6e9298;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        display: flex;
        width: 100vw;
        height: 100vh; /* fallback for browsers without dvh support */
        height: 100dvh; /* tracks the *actual* visible viewport, so mobile
                            Safari's address/tab bar doesn't crop the game */
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
